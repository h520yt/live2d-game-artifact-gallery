name: Brown Dust 2 Prestige tests
on:
  push:
    paths:
      - 'brown_dust2/**'
      - '.github/workflows/bd2-prestige-tests.yml'
  pull_request:
    paths:
      - 'brown_dust2/**'
      - '.github/workflows/bd2-prestige-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test local catalog and completeness validator
        run: python -m unittest discover -s brown_dust2/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Spine viewer playback calls
        run: node --test brown_dust2/tests/test_viewer_playback.cjs
