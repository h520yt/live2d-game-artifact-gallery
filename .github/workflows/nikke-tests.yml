name: NIKKE background and skin regression

on:
  push:
    paths:
      - "nikke/**"
      - ".github/workflows/nikke-tests.yml"
  pull_request:
    paths:
      - "nikke/**"
      - ".github/workflows/nikke-tests.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "Pillow>=10" "requests>=2.31"
      - name: Python syntax checks
        run: python -m compileall -q nikke/scripts nikke/tests
      - name: Nikke offline regression tests
        run: python -m unittest discover -s nikke/tests -v
      - name: JavaScript syntax checks
        run: |
          node --check nikke/viewer/art_scene.js
          node --check nikke/scripts/render_art.mjs
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("nikke/viewer/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.S)
          assert scripts, "NIKKE viewer inline JS missing"
          Path("/tmp/nikke-viewer-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/nikke-viewer-inline.js
