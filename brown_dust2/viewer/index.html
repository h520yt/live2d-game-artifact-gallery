<style>
:root{--bg:#100d19;--panel:#1b1829;--line:#40354e;--gold:#e8c58b;--text:#f4ecf6;--muted:#ab9cae}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse at 65% 0%,#32203f 0%,var(--bg) 55%);color:var(--text);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;margin:0;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 1.6vw;border-bottom:1px solid var(--line)}
header h1{font-size:22px;letter-spacing:.06em;margin:4px 0}
.subtitle{color:var(--muted);font-size:12px;letter-spacing:.08em}
a{color:var(--gold)}
.back{font-size:13px;text-decoration:none;white-space:nowrap}
.layout{display:grid;grid-template-columns:clamp(240px,19vw,300px) minmax(0,1fr);gap:14px;padding:14px 1.6vw;align-items:start}
.sidebar,.viewer{border:1px solid var(--line);background:rgba(23,18,36,.92);border-radius:16px;min-height:0}
.sidebar{padding:15px;overflow:hidden}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar h2{font-size:16px;margin:0}
.collection-filters{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.collection-filters button{font-size:11px;padding:4px 8px}
.collection-filters button.active{border-color:var(--gold);color:var(--gold);background:#382b3a}
.collection-info{font-size:11px;color:var(--muted);margin:8px 0}
.counter{color:var(--muted);font-size:12px}

.card:hover,.card.active{border-color:var(--gold);background:linear-gradient(120deg,#423044,#231d31)}
.card-title{font-size:15px;font-weight:600}
.card-sub{font-size:12px;color:var(--muted);margin:3px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid #66546c;padding:1px 7px;border-radius:12px;color:#d7c5d9}
.tag.ready{color:#a6dfb8;border-color:#5f966b}
.tag.wait{color:#ecc48b;border-color:#927143}
.viewer{padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.heading h2{margin:0;font-size:19px}

.render-tools #skin-choice{max-width:240px}
.render-tools #scene-choice{max-width:170px}
.render-tools #alpha-mode{max-width:150px}

button{cursor:pointer;border-radius:7px;background:#2e253c;color:var(--text);border:1px solid #594a63;padding:8px 12px}
button:hover:not(:disabled),button.active{border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.45;cursor:not-allowed}
.stage{position:relative;height:clamp(560px,73dvh,1300px);min-height:0;flex:0 0 auto;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#352b41 0%,#13101e 70%)}
body.theater-mode{overflow:hidden}
.viewer.theater{position:fixed;inset:0;z-index:1000;width:100vw;height:100dvh;max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;padding:12px clamp(10px,2vw,32px);background:#151021;overflow:hidden}
.viewer.theater .stage{height:auto;flex:1 1 auto;min-height:0;max-height:none}
.viewer.theater .heading{flex-shrink:0}

.empty strong{color:var(--gold)}
.status{color:var(--muted);font-size:12px;min-height:18px}

.motions button{font-size:12px;padding:6px 9px}

code{font-family:Consolas,monospace;color:#eace9b}
@media(max-width:960px){.layout{grid-template-columns:1fr}.sidebar,.viewer{min-height:0}.cards{max-height:230px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.stage{height:max(530px,68dvh)}.viewer.theater .stage{height:auto}}

<header>
 <div><div class="subtitle">GAME ARTIFACT GALLERY · INTERACTION FIRST</div><h1>棕色尘埃2 · 独立互动优先展示柜</h1></div>
 <a class="back" href="../../index.html">← 返回游戏展柜</a>

<main class="layout">
 <section class="sidebar">
  <div class="sidebar-top"><h2>服装目录</h2><span class="counter" id="count">读取中</span></div>
  <div class="collection-filters" id="filters">

    <button type="button" data-filter="special">特殊皮肤</button>
    <button type="button" data-filter="style">御姐/腿部</button>
    <button type="button" data-filter="mature">成熟御姐</button>
    <button type="button" data-filter="stockings">黑丝/网袜</button>

  </div>

  <div class="collection-info" id="collection-info">独立互动优先；允许只安装互动骨骼</div>
  <div class="cards" id="cards"></div>
  <p class="status" id="list-status"></p>
 </section>
 <section class="viewer" id="viewer">
  <div class="heading">
   <div><h2 id="title">请选择左侧皮肤</h2><p id="description">角色模型 / 技能演出 / 互动场景</p></div>
   <div class="actions">
     <button id="theater-toggle" type="button" aria-pressed="false" title="沉浸式大屏预览，按 Esc 退出">大屏预览 ⛶</button>

   </div>
  </div>
  <div class="roles" id="roles"></div>
  <div class="render-tools">
    <label for="scene-choice">互动场景</label>
    <select id="scene-choice" disabled title="切换完整场景，自动配对该场景的 Skin 和待机动作">
      <option>等待加载</option>
    </select>
    <label for="skin-choice">模型部件</label>
    <select id="skin-choice" disabled title="选择 Spine Skin，用于恢复默认未显示的模型部件">
      <option>等待加载</option>
    </select>
    <label for="alpha-mode">透明边缘</label>

      <option value="pma">预乘 Alpha（默认）</option>
      <option value="straight">普通 Alpha（对比）</option>
    </select>
    <button id="auto-focus" disabled title="识别实际可见内容，忽略大片黑色区域">智能铺满</button>
    <label for="zoom">缩放</label>
    <input id="zoom" type="range" min="50" max="500" step="10" value="100" disabled>

    <button id="reset-camera" disabled title="完整显示当前模型，不裁剪人物">完整适配</button>
  </div>
  <div class="stage">
   <div id="spine-root"></div>
   <div class="empty" id="empty"><strong>Prestige Skin</strong><p>选择已安装皮肤，预览 Spine 4.1 动画</p></div>
  </div>
  <div class="status" id="status"></div>
  <div class="motions" id="motions"></div>
  <div class="hint" id="install-hint">正在检查本地模型完整性...</div>
 </section>
</main>
<script src="../../shared/vendor/spine-player4.0.js"></script>
<script src="../../shared/vendor/spine-player4.1.js"></script>
<script>
"use strict";
const ROLE_NAME = {character:"人物动态",cutscene:"技能演出",interaction:"互动动画"};
const $ = id => document.getElementById(id);
let catalog = [];
let collectionFilter = "interactive";
let installed = new Map();
let selected = null;
let player = null;
let currentRole = "";
let loadId = 0;
let alphaMode = localStorage.getItem("bd2.alphaMode") === "straight" ? "straight" : "pma";
let chosenSkin = null;
let manualSkinSelection = false;
let activeSpine = null;
$("alpha-mode").value = alphaMode;


// Spine 背景/遮罩会撑大骨骼边界，以下只分析画布上的真实彩色内容。
// 对有大量黑边的互动动画智能放大；其他类别仍保留原来的取景。
let cameraView = null;
let focusTimer = null;
let focusSerial = 0;

function clearFocus() {
  focusSerial++;
  if (focusTimer !== null) clearTimeout(focusTimer);
  focusTimer = null;
  cameraView = null;
  $("zoom").disabled = true;
  $("auto-focus").disabled = true;
  $("zoom").value = 100;
  $("zoom-label").textContent = "1.0×";
}

function applyCameraView(pl) {
  if (pl !== activeSpine || !cameraView || cameraView.token !== loadId) return false;
  const camera = pl.sceneRenderer && pl.sceneRenderer.camera;
  if (!camera) return false;
  camera.position.x = cameraView.x;
  camera.position.y = cameraView.y;
  camera.zoom = cameraView.baseZoom / cameraView.factor;
  camera.update();
  return true;
}

function setZoomFactor(pl, factor) {
  if (!cameraView || !Number.isFinite(factor)) return false;
  cameraView.factor = Math.min(5, Math.max(0.5, factor));
  $("zoom").value = Math.round(cameraView.factor * 10) * 10;
  $("zoom-label").textContent = cameraView.factor.toFixed(1) + "×";
  return applyCameraView(pl);
}

// 小尺寸像素采样，忽略纯黑/近黑背景和透明区域。
function findContentBounds(width, height, pixels) {
  let minX = width, minY = height, maxX = -1, maxY = -1, count = 0;
  if (!pixels || pixels.length < width * height * 4) return null;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = 4 * (y * width + x);
      const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
      if (pixels[i + 3] < 50 || Math.max(r,g,b) < 58 || r+g+b < 118) continue;
      count++;
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
    }
  }
  if (count < Math.max(24, width * height / 1200)) return null;
  return {left:minX, top:minY, width:maxX-minX+1, height:maxY-minY+1,
    centerX:(minX+maxX+1)/2, centerY:(minY+maxY+1)/2};
}

function sampleVisibleContent(canvas) {
  if (!canvas || canvas.width < 2 || canvas.height < 2) return null;
  const width = Math.min(320, canvas.width);
  const height = Math.max(1, Math.round(canvas.height * width / canvas.width));
  const buffer = document.createElement("canvas");
  buffer.width = width; buffer.height = height;
  const ctx = buffer.getContext("2d", {willReadFrequently:true});
  if (!ctx) return null;
  ctx.drawImage(canvas, 0, 0, width, height);
  const rect = findContentBounds(width, height, ctx.getImageData(0,0,width,height).data);
  if (!rect) return null;
  return {x:rect.centerX/width, y:rect.centerY/height,
    width:rect.width/width, height:rect.height/height};
}

function autoFocusInteraction(pl, serial=focusSerial) {
  if (pl !== activeSpine || currentRole !== "interaction" ||
      !cameraView || serial !== focusSerial) return false;
  try {
    const content = sampleVisibleContent(pl.canvas);
    if (!content) return false;
    // 黑色遮罩可能将正常画面压缩到不足舞台的 1/15，7 倍仍无法看清。
    // 极限 20 倍只在有足够大且连续的可见内容区域时启用。
    if (content.width * content.height < 0.002) return false;
    const ratio = Math.min(20, 0.86/content.width, 0.84/content.height);
    if (!Number.isFinite(ratio) || ratio < 1.15) return false;
    const unitsPerPixel = cameraView.baseZoom / cameraView.factor;
    cameraView.x += (content.x - 0.5) * pl.canvas.width * unitsPerPixel;
    cameraView.y -= (content.y - 0.5) * pl.canvas.height * unitsPerPixel;
    cameraView.baseZoom /= ratio;
    cameraView.factor = 1;
    setZoomFactor(pl, 1);
    setStatus("互动动画已智能放大 " + ratio.toFixed(1) + " 倍 · 可通过缩放微调");
    return true;
  } catch (error) {
    console.warn("BD2 自动取景异常", error);
    return false;
  }
}

function scheduleAutoFocus(pl, delay=300) {
  if (currentRole !== "interaction" || pl !== activeSpine) return;
  if (focusTimer !== null) clearTimeout(focusTimer);
  const serial = ++focusSerial;
  focusTimer = setTimeout(() => {
    focusTimer = null;
    if (serial === focusSerial) autoFocusInteraction(pl, serial);
  }, delay);
}

// 与播放器帧循环中的相机更新同步，避免刚放大下一帧又被自动视口覆盖。
function bindCameraControls(pl) {
  const canvas = pl.canvas;
  if (!canvas) return;
  let last = null;
  canvas.addEventListener("pointerdown", event => {
    if (event.button !== 0 || !cameraView) return;
    last = {id:event.pointerId,x:event.clientX,y:event.clientY};
    canvas.setPointerCapture?.(event.pointerId);
  });
  canvas.addEventListener("pointermove", event => {
    if (!last || event.pointerId !== last.id || !cameraView) return;
    const rect = canvas.getBoundingClientRect();
    const zoom = cameraView.baseZoom / cameraView.factor;
    cameraView.x -= (event.clientX - last.x) * canvas.width / Math.max(rect.width,1) * zoom;
    cameraView.y += (event.clientY - last.y) * canvas.height / Math.max(rect.height,1) * zoom;
    last.x = event.clientX; last.y = event.clientY;
    applyCameraView(pl);
  });
  const end = () => {last=null;};
  canvas.addEventListener("pointerup",end);
  canvas.addEventListener("pointercancel",end);
  canvas.addEventListener("wheel",event => {
    if (!cameraView) return;
    event.preventDefault();
    setZoomFactor(pl, cameraView.factor * (event.deltaY < 0 ? 1.1 : 1/1.1));
  },{passive:false});
}

// 官方播放器按 premultipliedAlpha 绘制时，上传 WebGL 贴图也必须预乘。
// 仅对当前展柜自己的 canvas 生效，避免影响页面上的其它 WebGL 程序。
function patchTextureUpload() {
  for (const api of [window.WebGLRenderingContext, window.WebGL2RenderingContext]) {
    if (!api || !api.prototype || api.prototype.__bd2PmaTextureUpload) continue;
    const proto = api.prototype;
    const originalUpload = proto.texImage2D;
    proto.texImage2D = function (...args) {
      const canvas = this.canvas;
      if (canvas && typeof canvas.closest === "function" &&
          canvas.closest("#spine-root")) {
        this.pixelStorei(this.UNPACK_PREMULTIPLY_ALPHA_WEBGL, alphaMode === "pma");
      }
      return originalUpload.apply(this, args);
    };
    proto.__bd2PmaTextureUpload = true;
  }
}
patchTextureUpload();

function isIdleAnimation(name) {
  return /^(?:idle\d*|loop\d*|stand(?:by)?\d*|wait\d*)(?:[_-]|$)/i.test(name);
}

function getAnimationGroup(name) {
  const match = /^mix(\d+)(?:[_-]|$)/i.exec(name);
  return match ? Number(match[1]) : null;
}

// BD2 的 mix2_1_1、mix2_1_2 ... mix2_1_end 是连续的过渡片段，
// 单独播放某一帧可能恰好位于遮罩或隐藏身体的时间段。
function parseMixSegment(name) {
  const match = /^mix(\d+)_(\d+)_(\d+|end)$/i.exec(name || "");
  return match ? {
    group: Number(match[1]),
    action: Number(match[2]),
    step: match[3].toLowerCase() === "end" ? Infinity : Number(match[3]),
    name
  } : null;
}

function getMixSequence(names, name) {
  const selected = parseMixSegment(name);
  if (!selected) return null;
  const segments = names.map(parseMixSegment).filter(item =>
    item && item.group === selected.group && item.action === selected.action);
  if (segments.length < 2) return null;
  segments.sort((a,b) => a.step-b.step || a.name.localeCompare(b.name));
  return {
    key: "mix" + selected.group + "_" + selected.action,
    group: selected.group,
    clips: segments.map(item => item.name)
  };
}

function getMixSequences(names) {
  const groups = new Map();
  for (const name of names) {
    const sequence = getMixSequence(names,name);
    if (sequence && !groups.has(sequence.key)) groups.set(sequence.key,sequence);
  }
  return [...groups.values()];
}

function countSkinAttachments(skin) {
  try {
    return typeof skin.getAttachments === "function" ? skin.getAttachments().length : 0;
  } catch (error) {
    return 0;
  }
}

function bestSkin(skins) {
  const ranked = (skins || []).slice().sort((a, b) => {
    const delta = countSkinAttachments(b) - countSkinAttachments(a);
    if (delta) return delta;
    return a.name === "default" ? -1 : b.name === "default" ? 1 : 0;
  });
  return ranked[0] || null;
}

// 互动文件的 Skin 名（如 idle3_1）往往就是场景/动作分组，不能按部件数最多选。
// 例如 Skin=idle3_1 + 动画=idle1 会造成背景正常、人物缺失。
function idleSceneKey(name) {
  const match = /^idle(\d+)(?:[_-](\d+))?$/i.exec(name || "");
  return match ? {group:Number(match[1]),variant:match[2] || ""} : null;
}

function skinForAnimation(skins, animation) {
  if (!skins || !skins.length || !animation) return null;
  const byName = new Map(skins.map(skin => [skin.name.toLowerCase(),skin]));
  const direct = byName.get(animation.toLowerCase());
  if (direct) return direct;
  const idle = idleSceneKey(animation);
  const mix = /^mix(\d+)(?:[_-](\d+))?/i.exec(animation);
  const group = idle ? idle.group : mix ? Number(mix[1]) : null;
  if (group !== null) {
    // 优先当前分组对应的 Skin，不跨到其它故事场景。
    const variant = idle ? idle.variant : mix[2] || "";
    if (variant && byName.has("idle" + group + "_" + variant)) {
      return byName.get("idle" + group + "_" + variant);
    }
    if (chosenSkin && byName.has(chosenSkin.toLowerCase())) {
      const previous = idleSceneKey(chosenSkin);
      if (previous && previous.group === group) return byName.get(chosenSkin.toLowerCase());
    }
    return byName.get("idle" + group)
      || skins.find(skin => idleSceneKey(skin.name)?.group === group)
      || byName.get("default") || null;
  }
  return byName.get("default") || null;
}

function pickInitialScene(animations, skins, restoredAnimation=null, restoredSkin=null) {
  if (restoredAnimation && animations.includes(restoredAnimation)) {
    const skin = skins.find(item => item.name === restoredSkin)
      || skinForAnimation(skins, restoredAnimation)
      || bestSkin(skins);
    return {animation:restoredAnimation,skin};
  }
  const idles = animations.filter(name => isIdleAnimation(name));
  const pairs = idles.map(name => ({
    animation:name,
    skin:skinForAnimation(skins,name)
  })).filter(item => item.skin);
  // 优先同名的完整场景，避免错配。按最小 idle 组号打开最早场景。
  const matchRank = item => {
    if (item.skin.name.toLowerCase() === item.animation.toLowerCase()) return 0;
    const animationScene = idleSceneKey(item.animation);
    const skinScene = idleSceneKey(item.skin.name);
    if (animationScene && skinScene && animationScene.group === skinScene.group) return 1;
    return item.skin.name === "default" ? 2 : 3;
  };
  const sceneRank = item => {
    const id = idleSceneKey(item.animation);
    return id ? id.group * 100 + (id.variant ? Number(id.variant) || 1 : 0) : 50000;
  };
  const good = pairs.sort((a,b) => matchRank(a)-matchRank(b) || sceneRank(a)-sceneRank(b))[0];
  if (good) return good;
  const animation = idles[0] || animations[0] || null;
  return {animation,skin:skinForAnimation(skins,animation) || bestSkin(skins)};
}

function applySkin(pl, name) {
  const skeleton = pl.skeleton;
  if (!skeleton || !skeleton.data || !skeleton.data.skins) return false;
  const skin = skeleton.data.skins.find(item => item.name === name);
  if (!skin) return false;
  skeleton.setSkin(skin);
  skeleton.setSlotsToSetupPose();
  skeleton.updateWorldTransform();
  chosenSkin = name;
  return true;
}

// 使用当前 Skin 的世界坐标边界计算取景，不采用会让人物缩成一点的默认动作边界。
// 优先统计实际可见的角色部件，忽略背景槽位，避免背景导致人物缩得过小。
// mesh 与 region 的世界顶点方法参数不同，按 worldVerticesLength 区分，失败时退回整个骨骼。
function getCharacterBounds(skeleton) {
  if (!skeleton || !Array.isArray(skeleton.drawOrder)) return null;
  let left = Infinity, right = -Infinity, bottom = Infinity, top = -Infinity;
  let count = 0;
  for (const slot of skeleton.drawOrder) {
    const name = slot.data?.name || "";
    if (/^(?:bg|bk)(?:[_0-9]|$)|(?:^|[_ ])background(?:[_ ]|$)/i.test(name)) continue;
    const attachment = slot.getAttachment?.();
    if (!attachment || typeof attachment.computeWorldVertices !== "function") continue;
    try {
      let vertices;
      if (Number.isInteger(attachment.worldVerticesLength) && attachment.worldVerticesLength > 0) {
        if (attachment.worldVerticesLength > 100000) continue;
        vertices = new Float32Array(attachment.worldVerticesLength);
        attachment.computeWorldVertices(slot, 0, vertices.length, vertices, 0, 2);
      } else {
        vertices = new Float32Array(8);
        attachment.computeWorldVertices(slot.bone, vertices, 0, 2);
      }
      for (let i=0;i<vertices.length;i+=2) {
        const x=vertices[i], y=vertices[i+1];
        if(!Number.isFinite(x) || !Number.isFinite(y)) continue;
        left=Math.min(left,x);right=Math.max(right,x);
        bottom=Math.min(bottom,y);top=Math.max(top,y);
        count++;
      }
    } catch (error) {
      // 部分 attachment 并非可渲染几何体，跳过即可。
    }
  }
  if(count < 4 || !(right > left && top > bottom) ||
      right-left > 50000 || top-bottom > 50000) return null;
  return {x:left,y:bottom,width:right-left,height:top-bottom};
}


// 互动骨骼的背景/遮罩网格可能比真正场景大几十倍；对这种情况按可见主体计算边界。
// 只改变摄像机，不修改 Spine 贴图、mesh 顶点、skin 或动画轨道。
function getInteractionBounds(skeleton) {
  if (!skeleton || !Array.isArray(skeleton.drawOrder)) return null;
  const regions = [];
  for (const slot of skeleton.drawOrder) {
    if (!slot || !slot.data) continue;
    const name = String(slot.data.name || "");
    if (/(?:^|[_\s-])(?:bg|background|backdrop|mask|vignette|blackout|screenfade)(?:$|[_\s-])/i.test(name)
        || /^(?:bg|bk|background|mask|vignette)/i.test(name)) continue;
    const attachment = slot.getAttachment?.();
    if (!attachment || typeof attachment.computeWorldVertices !== "function") continue;
    try {
      let vertices;
      if (Number.isInteger(attachment.worldVerticesLength) && attachment.worldVerticesLength >= 4) {
        if (attachment.worldVerticesLength > 100000) continue;
        vertices = new Float32Array(attachment.worldVerticesLength);
        attachment.computeWorldVertices(slot, 0, vertices.length, vertices, 0, 2);
      } else {
        vertices = new Float32Array(8);
        attachment.computeWorldVertices(slot.bone, vertices, 0, 2);
      }
      let left=Infinity, right=-Infinity, bottom=Infinity, top=-Infinity;
      for (let i=0;i<vertices.length;i+=2) {
        if (!Number.isFinite(vertices[i]) || !Number.isFinite(vertices[i+1])) continue;
        left=Math.min(left,vertices[i]); right=Math.max(right,vertices[i]);
        bottom=Math.min(bottom,vertices[i+1]); top=Math.max(top,vertices[i+1]);
      }
      if (right > left && top > bottom) {
        regions.push({left,right,bottom,top,size:Math.max(right-left,top-bottom)});
      }
    } catch (error) {
      // clipping 等无常规世界顶点的附件不参与相机取景。
    }
  }
  if (regions.length < 3) return null;
  // 防止名称不规范的巨型遮罩仍把场景挤成中心小点。
  const sizes=regions.map(item=>item.size).sort((a,b)=>a-b);
  const median=sizes[Math.floor(sizes.length / 2)];
  const core=regions.filter(item=>item.size <= Math.max(100, median*18));
  if (core.length < 3) return null;
  const left=Math.min(...core.map(item=>item.left));
  const right=Math.max(...core.map(item=>item.right));
  const bottom=Math.min(...core.map(item=>item.bottom));
  const top=Math.max(...core.map(item=>item.top));
  if (!(right > left && top > bottom) || right-left > 50000 || top-bottom > 50000) {
    return null;
  }
  return {x:left,y:bottom,width:right-left,height:top-bottom};
}

function boundsUsable(width,height) {
  return Number.isFinite(width) && Number.isFinite(height)
    && width > 1 && height > 1 && width < 50000 && height < 50000;
}

function resetCamera(pl) {
  const skeleton = pl && pl.skeleton;
  const camera = pl && pl.sceneRenderer && pl.sceneRenderer.camera;
  const canvas = pl && pl.canvas;
  if (!skeleton || !camera || !canvas) return false;
  const offset = {x:0,y:0,set(x,y){this.x=x;this.y=y;}};
  const size = {x:0,y:0,set(x,y){this.x=x;this.y=y;}};
  try {
    skeleton.updateWorldTransform();
    skeleton.getBounds(offset, size);
    const originalSize = {width:size.x, height:size.y};
    const fallbackValid = boundsUsable(size.x, size.y);
    const trimmed = currentRole === "interaction"
      ? getInteractionBounds(skeleton)
      : currentRole === "character" ? getCharacterBounds(skeleton) : null;
    if (trimmed && boundsUsable(trimmed.width, trimmed.height)) {
      // 人物背景轻微超出时可裁掉；互动必须确认存在严重的背景异常才切换，
      // 保持原有完整场景，不随意截断人物或正常大小的室内背景。
      const ratio = Math.max(size.x / trimmed.width, size.y / trimmed.height);
      const limit = currentRole === "interaction" ? 4 : 1.4;
      if (!fallbackValid || ratio >= limit) {
        offset.x=trimmed.x; offset.y=trimmed.y;
        size.x=trimmed.width; size.y=trimmed.height;
        console.info("BD2 已排除异常巨大背景网格，重新取景", {
          original:originalSize, trimmed, ratio
        });
      }
    }
    if (!boundsUsable(size.x, size.y)) {
      // 无有效骨骼边界时，不再禁用“智能铺满”：保留播放器原生相机，
      // 继续使用当前帧实际像素取景。
      cameraView = {
        x:camera.position.x, y:camera.position.y,
        baseZoom:camera.zoom, factor:1, token:loadId
      };
      $("zoom").disabled=false;
      $("auto-focus").disabled=currentRole !== "interaction";
      setZoomFactor(pl,1);
      return false;
    }
    // 完整适配保留约 8% 留白；取 max 表示 contain，不会因为放大而裁掉身体。
    const paddedWidth = size.x * 1.12;
    const paddedHeight = size.y * 1.12;
    cameraView = {
      x:offset.x + size.x / 2,
      y:offset.y + size.y / 2,
      baseZoom:Math.max(paddedWidth / Math.max(canvas.width,1),
                         paddedHeight / Math.max(canvas.height,1)),
      factor:1,
      token:loadId
    };
    $("zoom").disabled = false;
    $("auto-focus").disabled = currentRole !== "interaction";
    setZoomFactor(pl, 1);
    // 保留 SpinePlayer 原生 viewport 配置，不覆盖内部 animations 字典。
    // 动画的 <empty> 过渡可能在下一帧才调用 setViewport()。
    return true;
  } catch (error) {
    console.warn("BD2 模型取景计算失败，回退到播放器相机+像素取景", error);
    cameraView = {
      x:camera.position.x, y:camera.position.y,
      baseZoom:Number.isFinite(camera.zoom) && camera.zoom > 0 ? camera.zoom : 1,
      factor:1,token:loadId
    };
    $("zoom").disabled=false;
    $("auto-focus").disabled=currentRole !== "interaction";
    setZoomFactor(pl,1);
    return false;
  }
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if(cls) node.className = cls;
  if(text !== undefined) node.textContent = text;
  return node;
}

function badge(text, kind) {
  return el("span", "tag " + (kind || ""), text);
}

function setStatus(text) {$("status").textContent = text;}

function disposePlayer() {
  loadId += 1;
  clearFocus();
  if (player) {
    try {player.dispose();} catch(error) {console.warn(error);}
    player = null;
  }
  $("spine-root").replaceChildren();
  $("save").disabled = true;
  $("motions").replaceChildren();
  $("skin-choice").replaceChildren();
  $("skin-choice").disabled = true;
  $("scene-choice").replaceChildren();
  $("scene-choice").disabled = true;
  $("reset-camera").disabled = true;
  chosenSkin = null;
  manualSkinSelection = false;
  activeSpine = null;
}

function isPrestige(skin) {
  return skin.tier === "Prestige Skin" || !skin.id.startsWith("costume-");
}

function isSpecial(skin) {
  return isPrestige(skin) || skin.tier === "Special Skin";
}

function hasStyleTag(skin, tag) {
  return Array.isArray(skin.preference_tags) && skin.preference_tags.includes(tag);
}

function hasInstalledModel(skin) {
  return Boolean(installed.get(skin.id) && Object.keys(installed.get(skin.id).roles).length);
}

function interactionLabel(skin) {
  const installedRoles = installed.get(skin.id)?.roles || {};
  if (installedRoles.interaction) return "独立互动已安装";
  if (skin.roles.interaction) return "互动待下载";
  if (skin.tier === "Special Skin") return "官方无独立互动";
  return "未找到对应互动";
}

function roleHint(skin, role, model) {
  if (model) return ROLE_NAME[role];
  if (role === "interaction") return interactionLabel(skin);
  return skin.roles[role] ? ROLE_NAME[role] + "（待下载）" : ROLE_NAME[role] + "（无资源）";
}

function renderCards(filter) {
  $("cards").replaceChildren();
  const q = (filter || "").trim().toLowerCase();
  const matches = catalog.filter(skin => {
    const keyword = [skin.character,skin.character_en,skin.skin,
      skin.skin_en,skin.id,skin.costume_id || ""]
      .some(value => String(value).toLowerCase().includes(q));
    if (!keyword) return false;
    if (collectionFilter === "batch") return skin.interaction_batch === "interaction-02";
    if (collectionFilter === "special") return isSpecial(skin);
    if (collectionFilter === "style") return Boolean(skin.preference_tags?.length);
    if (collectionFilter === "mature") return hasStyleTag(skin, "成熟御姐");
    if (collectionFilter === "stockings") return hasStyleTag(skin, "黑丝/网袜");
    if (collectionFilter === "legs") return hasStyleTag(skin, "腿部重点");
    if (collectionFilter === "installed") return hasInstalledModel(skin);
    if (collectionFilter === "interactive") return Boolean(skin.roles.interaction);
    return true;
  });
  for (const skin of matches) {
    const present = installed.get(skin.id);
    const roles = present ? Object.keys(present.roles) : [];
    const card = el("button", "card" + (selected && selected.id === skin.id ? " active" : ""));
    card.appendChild(el("div", "card-title", skin.character + " · " + skin.skin));
    card.appendChild(el("div", "card-sub", skin.character_en + " / " +
      skin.skin_en + (skin.costume_id ? " · " + skin.costume_id : "")));
    const tags = el("div","tags");
    const tierLabel = skin.interaction_only ? "独立互动专辑"
      : isPrestige(skin) ? "Prestige"
      : skin.tier === "Special Skin" ? "Special Skin" : "风格精选";
    tags.appendChild(badge(tierLabel));
    tags.appendChild(badge(roles.length ? "本地 " + roles.length +
      "/" + Object.keys(skin.roles).length + " 类" : "待安装",
      roles.length ? "ready" : "wait"));
    for (const name of skin.preference_tags || []) tags.appendChild(badge(name));
    if (skin.interaction_only) {
      tags.appendChild(badge("仅互动，无需人物/技能"));
      for (const name of skin.interaction_tags || []) tags.appendChild(badge(name));
    }
    tags.appendChild(badge(interactionLabel(skin),
      roles.includes("interaction") ? "ready" : "wait"));
    if (skin.mapping === "candidate") tags.appendChild(badge("映射待核实"));
    card.appendChild(tags);
    card.onclick = () => selectSkin(skin);
    $("cards").appendChild(card);
  }
  const localCount = catalog.filter(hasInstalledModel).length;
  $("count").textContent = localCount + " 已安装 / " + catalog.length + " 精选";
  $("collection-info").textContent = "本页显示 " + matches.length
    + " 套 · 特殊 " + catalog.filter(isSpecial).length
    + " · 独立互动 " + catalog.filter(skin => skin.roles.interaction).length
    + " · 本批新增 " + catalog.filter(skin => skin.interaction_batch).length
    + " · 互动优先";
  $("list-status").textContent = matches.length ? "" : "当前条件没有符合要求的皮肤";
  for (const button of $("filters").querySelectorAll("button")) {
    button.classList.toggle("active", button.dataset.filter === collectionFilter);
  }
}

function selectSkin(skin) {
  selected = skin;
  disposePlayer();
  $("title").textContent = skin.character + " · " + skin.skin;
  $("description").textContent = skin.character_en + " / " + skin.skin_en +
    (skin.interaction_only ? " · 互动专辑（仅独立互动模型）"
      : isPrestige(skin) ? " · Prestige Skin" : " · " + skin.tier)
    + " · " + interactionLabel(skin);
  const item = installed.get(skin.id);
  const downloadedRoles = item?.roles || {};
  $("roles").replaceChildren();
  for (const role of Object.keys(ROLE_NAME)) {
    const info = downloadedRoles[role];
    const label = roleHint(skin, role, info);
    const button = el("button", "", label);
    button.disabled = !info;
    button.title = label;
    button.onclick = () => loadRole(role);
    $("roles").appendChild(button);
  }
  if (!item || !Object.keys(item.roles).length) {
    $("empty").hidden = false;
    $("empty").textContent = "资源尚未下载。执行 python brown_dust2/scripts/install_prestige.py --only " + skin.id;
    const label = interactionLabel(skin);
    setStatus("本地资源尚未安装 · " + label
      + (skin.roles.interaction
        ? " · 只补互动：python brown_dust2/scripts/install_prestige.py --only "
          + skin.id + " --role interaction"
        : ""));
  } else {
    loadRole(item.roles.character ? "character" : Object.keys(item.roles)[0]);
  }
  renderCards($("search").value);
}

async function blobDataUrl(blob) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

// 使用 SpinePlayer 对外的播放接口；setAnimation 只指定动作，必须 play() 才会渲染。
// 不循环的技能/触摸演出结束后自动回到待机，避免停在空白帧。
function selectAnimation(pl, name) {
  const names = pl.animationState.data.skeletonData.animations.map(item => item.name);
  const group = currentRole === "interaction" ? getAnimationGroup(name) : null;
  const baseIdle = group !== null
    ? names.find(item => item.toLowerCase() === "idle" + group)
      || names.find(item => idleSceneKey(item)?.group === group)
    : null;
  const sequence = currentRole === "interaction" && baseIdle
    ? getMixSequence(names,name) : null;
  const loop = isIdleAnimation(name) || (currentRole === "interaction" && group !== null && !sequence);
  const fallback = names.find(item => /^idle\d*$/i.test(item))
    || names.find(item => /^(stand|wait|loop)/i.test(item));
  try {
    let changedSkin = false;
    if (currentRole === "interaction" && !manualSkinSelection) {
      const candidate = skinForAnimation(pl.skeleton?.data?.skins || [], name);
      if (candidate && candidate.name !== chosenSkin) {
        changedSkin = applySkin(pl, candidate.name);
        const menu = $("skin-choice");
        if (menu) menu.value = candidate.name;
      }
    }
    if (baseIdle) {
      const state = pl.animationState;
      state.clearTracks();
      if (pl.skeleton) pl.skeleton.setToSetupPose();
      const base = state.setAnimation(0, baseIdle, true);
      if (base) {
        base.trackEnd = Number.MAX_VALUE;
        base.mixDuration = 0;
        base.mixTime = 0;
      }
      const clips = sequence?.clips || [name];
      const first = state.setAnimation(1, clips[0], !sequence);
      if (first) {
        first.mixDuration = 0;
        first.mixTime = 0;
      }
      if (sequence) {
        // 同一互动按帧序执行，不能把 mix2_1_13 排在 mix2_1_2 之前；
        // 结束后清除轨道 1，保留轨道 0 的 idle2，防止黑屏永久留在结束帧。
        for (const clip of clips.slice(1)) {
          const entry = state.addAnimation(1, clip, false, 0);
          if (entry) {
            entry.mixDuration = 0;
            entry.mixTime = 0;
          }
        }
        state.addEmptyAnimation?.(1, 0, 0);
      }
    } else {
      pl.animationState.clearTracks();
      pl.setAnimation(name, loop);
      if (!loop && fallback && fallback !== name) {
        pl.addAnimation(fallback, true, 0);
      }
    }
    if (pl.skeleton) {
      pl.animationState.apply?.(pl.skeleton);
      pl.skeleton.updateWorldTransform?.();
    }
    pl.play();
    if (changedSkin) resetCamera(pl);
    if (currentRole === "interaction" && (changedSkin || sequence)) {
      scheduleAutoFocus(pl, 380);
    }
    for (const button of $("motions").children) {
      button.classList.toggle("active",
        button.dataset?.animation === name || button.textContent === name ||
        (sequence && button.dataset?.sequence === sequence.key));
    }
    if (currentRole === "interaction") {
      const menu = $("scene-choice");
      const idleName = baseIdle || (isIdleAnimation(name) ? name : null);
      if (menu && idleName && [...menu.options].some(opt => opt.value === idleName)) {
        menu.value = idleName;
      }
      setStatus("互动场景 · Skin: " + (chosenSkin || "默认") +
        " · 动作: " + (sequence ? sequence.key + " 连续 " + sequence.clips.length + " 段" : name) +
        (manualSkinSelection ? " · 手动锁定Skin" : " · 自动配对") +
        (group !== null && !baseIdle ? " · ⚠ 当前动作缺少对应 idle" + group : ""));
    }
    return true;
  } catch (error) {
    setStatus("动作播放失败：" + (error.message || String(error)));
    console.error("BD2 Spine 播放失败", name, error);
    return false;
  }
}

async function loadRole(role, restore=null) {
  if (!selected) return;
  const item = installed.get(selected.id);
  if(!item || !item.roles[role]) return;
  disposePlayer();
  const ownLoad = loadId;
  currentRole = role;
  const model = item.roles[role];
  $("roles").querySelectorAll("button").forEach((button,index) => {
    const key = Object.keys(ROLE_NAME)[index];
    button.classList.toggle("active",key === role);
  });
  $("empty").hidden = false;
  $("empty").textContent = "加载 Spine 骨骼与贴图中...";
  setStatus(ROLE_NAME[role] + " · Spine " + model.version);
  const base = model.dir.replace(/\/$/,"") + "/";
  const skeletonUrl = base + encodeURIComponent(model.skel);
  const atlasUrl = base + encodeURIComponent(model.atlas);
  try {
    const response = await fetch(skeletonUrl);
    if(!response.ok) throw new Error("骨骼请求失败 HTTP " + response.status);
    const buffer = await response.arrayBuffer();
    if(ownLoad !== loadId) return;
    const prefix = new TextDecoder().decode(new Uint8Array(buffer).slice(0,64));
    let version = model.version;
    if (/4\.0\.\d+/.test(prefix)) version = "4.0";
    if (/4\.1\.\d+/.test(prefix)) version = "4.1";
    if (!["4.0","4.1"].includes(version)) throw new Error("当前共享播放器不支持 Spine " + version);
    const runtime = version === "4.0" ? window.spine40 : window.spine41;
    if(!runtime || !runtime.SpinePlayer) throw new Error("Spine runtime 未加载");
    const uri = await blobDataUrl(new Blob([buffer]));
    if(ownLoad !== loadId) return;
    // 保证舞台具有实际尺寸，避免 player 初始化为 300x150。
    await new Promise(resolve => requestAnimationFrame(resolve));
    if(ownLoad !== loadId) return;
    const key = selected.id + "-" + role;
    player = new runtime.SpinePlayer("spine-root",{
      skelUrl:key,
      rawDataURIs:{[key]:uri},
      atlasUrl:atlasUrl,
      // 预乘混合须与像素上传 UNPACK_PREMULTIPLY_ALPHA_WEBGL 保持一致。
      premultipliedAlpha:alphaMode === "pma",
      alpha:true,
      backgroundColor:"#00000000",
      preserveDrawingBuffer:true,
      showControls:false,
      defaultMix:role === "interaction" ? 0 : 0.18,
      // 不注入不完整的 viewport 配置；SpinePlayer 会为动画过渡生成 <empty>，
      // 缺少 viewport.animations 字典会导致渲染时读取 undefined['<empty>']。
      // 取景由 resetCamera() 使用 Spine 相机单独控制。
      update:() => {
        if (activeSpine) applyCameraView(activeSpine);
      },
      success:pl => {
        if(ownLoad !== loadId) return;
        $("empty").hidden = true;
        $("save").disabled = false;
        activeSpine = pl;
        bindCameraControls(pl);
        const skinOptions = pl.skeleton && pl.skeleton.data ? pl.skeleton.data.skins || [] : [];
        const orderedSkins = skinOptions.slice().sort((a,b) => countSkinAttachments(b)-countSkinAttachments(a));
        const select = $("skin-choice");
        select.replaceChildren();
        for(const skin of orderedSkins) {
          const option = document.createElement("option");
          option.value = skin.name;
          option.textContent = skin.name + " (" + countSkinAttachments(skin) + " 部件)";
          select.appendChild(option);
        }
        const anims = pl.animationState.data.skeletonData.animations.map(a => a.name);
        const initial = currentRole === "interaction"
          ? pickInitialScene(anims,skinOptions,restore?.animation,restore?.skin)
          : {animation:(restore?.animation && anims.includes(restore.animation)
                ? restore.animation : anims.find(name => isIdleAnimation(name)) || anims[0]),
             skin:(restore?.skin && skinOptions.find(skin => skin.name === restore.skin))
               || bestSkin(skinOptions)};
        const best = initial.skin;
        select.disabled = !best;
        manualSkinSelection = Boolean(restore?.skinLocked);
        if (best) {
          select.value = best.name;
          applySkin(pl,best.name);
          select.onchange = () => {
            if(ownLoad !== loadId) return;
            manualSkinSelection = true;
            applySkin(pl, select.value);
            const current = $("motions").querySelector("button.active");
            if(current) selectAnimation(pl,current.textContent);
            resetCamera(pl);
            scheduleAutoFocus(pl,180);
          };
        }
        $("reset-camera").disabled = false;
        $("reset-camera").onclick = () => {
          // 完整人物模式不运行内容裁边。只有点击「智能铺满」才进行可能裁边的聚焦。
          resetCamera(pl);
        };
        $("auto-focus").onclick = () => {
          resetCamera(pl);
          scheduleAutoFocus(pl, 160);
        };
        $("zoom").oninput = () => setZoomFactor(pl, Number($("zoom").value)/100);
        const scene = $("scene-choice");
        scene.replaceChildren();
        const idles = anims.filter(name => /^idle\d*(?:[_-]\d+)?$/i.test(name));
        scene.disabled = currentRole !== "interaction" || !idles.length;
        for(const name of idles) {
          const option = document.createElement("option");
          const matched = skinForAnimation(skinOptions,name);
          option.value = name;
          option.textContent = name + (matched ? " / " + matched.name : " / 默认");
          scene.appendChild(option);
        }
        scene.onchange = () => {
          if(ownLoad !== loadId) return;
          manualSkinSelection = false;
          if(selectAnimation(pl,scene.value)) {
            resetCamera(pl);
            scheduleAutoFocus(pl,280);
          }
        };
        $("motions").replaceChildren();
        if (currentRole === "interaction") {
          for (const group of getMixSequences(anims)) {
            const button = el("button","sequence-action",
              "▶ " + group.key + " 连播（" + group.clips.length + "段）");
            button.dataset.animation = group.clips[0];
            button.dataset.sequence = group.key;
            button.title = "完整播放连续动作，结束后返回对应 idle 场景";
            button.onclick = () => selectAnimation(pl,group.clips[0]);
            $("motions").appendChild(button);
          }
        }
        for(const name of anims) {
          const button = el("button","",name);
          button.dataset.animation = name;
          if (currentRole === "interaction" && getMixSequence(anims,name)) {
            button.title = "此动作是连续片段；点击后将完整连播同组动作";
          }
          button.onclick = () => selectAnimation(pl,name);
          $("motions").appendChild(button);
        }
        const first = initial.animation;
        const started = first ? selectAnimation(pl, first) : false;
        if (started) {
          // 先应用 idle / mix，再自动检测实际画面；不修改 SpinePlayer 内部 viewport。
          resetCamera(pl);
          scheduleAutoFocus(pl);
          setStatus(ROLE_NAME[role] + " · " + anims.length + " 个动作 · Skin: " +
            (chosenSkin || "默认") + " · Alpha: " + alphaMode + " · 正在播放");
        } else {
          $("empty").hidden = false;
          $("empty").textContent = "骨骼已读取，但动作播放没有成功。请查看下方错误或浏览器控制台。";
          if (!first) setStatus("模型中没有可用动作，无法播放");
        }
      },
      error:(pl, message) => {
        if(ownLoad !== loadId) return;
        $("empty").hidden = false;
        $("empty").textContent = "动画加载失败，请核验骨骼版本及 atlas 贴图";
        const details = message || (pl && pl.message) || "Spine 加载失败，请查看控制台";
        setStatus("模型加载失败：" + details);
        console.error("BD2 Spine 加载失败", details);
      }
    });
  } catch(error) {
    if(ownLoad !== loadId) return;
    $("empty").hidden = false;
    $("empty").textContent = "本地文件读取失败";
    setStatus(String(error));
  }
}

// 切换舞台布局后重建播放器，保证 WebGL 帧缓冲与新舞台尺寸一致。
// 仅重建展示，不重新下载素材；保持角色、Skin 与当前动作。
function setTheaterMode(enabled) {
  const stage = $("viewer");
  if (stage.classList.contains("theater") === enabled) return;
  const savedRole = currentRole;
  const savedSkin = chosenSkin;
  const savedSkinLocked = manualSkinSelection;
  const selectedMotion = $("motions").querySelector("button.active");
  const savedAnimation = selectedMotion ? (selectedMotion.dataset.animation || selectedMotion.textContent) : null;
  stage.classList.toggle("theater", enabled);
  document.body.classList.toggle("theater-mode", enabled);
  $("theater-toggle").textContent = enabled ? "退出大屏（Esc）" : "大屏预览 ⛶";
  $("theater-toggle").setAttribute("aria-pressed", String(enabled));
  if (selected && savedRole && installed.get(selected.id)?.roles[savedRole]) {
    requestAnimationFrame(() => {
      loadRole(savedRole, {skin:savedSkin, skinLocked:savedSkinLocked, animation:savedAnimation});
    });
  }
}

$("theater-toggle").onclick = () => {
  setTheaterMode(!$("viewer").classList.contains("theater"));
};
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("viewer").classList.contains("theater")) {
    setTheaterMode(false);
  }
});

$("alpha-mode").onchange = () => {
  alphaMode = $("alpha-mode").value;
  localStorage.setItem("bd2.alphaMode", alphaMode);
  if (selected && currentRole) loadRole(currentRole);
};

$("save").onclick = () => {
  if(!selected || !player) return;
  const canvas = $("spine-root").querySelector("canvas");
  if(!canvas) return;
  try {
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = selected.id + "-" + currentRole + ".png";
    link.click();
  } catch(error) {setStatus("PNG 导出失败：" + error.message);}
};
$("search").oninput = event => renderCards(event.target.value);
for (const button of $("filters").querySelectorAll("button")) {
  button.onclick = () => {
    collectionFilter = button.dataset.filter;
    renderCards($("search").value);
  };
}
(async () => {
  try {
    const [a,b,c,d,e] = await Promise.all([
      fetch("../curated_prestige.json", {cache:"no-store"}),
      fetch("manifest.json", {cache:"no-store"}),
      fetch("../costume_catalog.json", {cache:"no-store"}),
      fetch("../curated_style.json", {cache:"no-store"}),
      fetch("../curated_interactions.json", {cache:"no-store"})
    ]);
    if(!a.ok || !b.ok || !c.ok || !d.ok || !e.ok) {
      throw new Error("互动资源索引不存在，请从项目根目录启动 HTTP 服务并更新代码");
    }
    const original = (await a.json()).skins || [];
    const allRegular = (await c.json()).skins || [];
    const styles = (await d.json()).styles || [];
    const interactionBatch = (await e.json()).skins || [];
    const styleMap = new Map(styles.map(style => [style.id, style]));
    const regular = allRegular.filter(skin => skin.tier === "Special Skin"
      || styleMap.has(skin.id)).map(skin => {
        const preference = styleMap.get(skin.id);
        return {
          ...skin,
          preference_tags: preference ? preference.tags : [],
          preference_reason: preference ? preference.reason : null
        };
      }).sort((a,b) => (a.tier === "Special Skin" ? 0 : 1)
        - (b.tier === "Special Skin" ? 0 : 1));
    catalog = [...interactionBatch,
      ...original.map(skin => ({...skin,tier:"Prestige Skin"})),
      ...regular];
    const ids = catalog.map(skin => skin.id);
    if (new Set(ids).size !== ids.length) {
      throw new Error("互动专辑与现有精选服装 ID 重复，请核对索引");
    }
    const priority = skin => skin.interaction_batch ? 0
      : skin.roles.interaction ? 1
      : isSpecial(skin) ? 2 : 3;
    catalog.sort((left,right) => priority(left)-priority(right));
    const manifest = await b.json();
    installed = new Map((manifest.installed || []).map(item => [item.id,item]));
    renderCards("");
    $("install-hint").textContent = "互动优先：本批新增 " + interactionBatch.length
      + " 套独立互动专辑（可只有互动模型）。"
      + " 命令：python brown_dust2/scripts/install_prestige.py --collection interaction-batch。"
      + " 补全部互动：--collection interactive --role interaction。"
      + " 无关旧素材继续留在本地。";
    setStatus("已读取本地模型索引；选择模型后将启动 Spine 播放。");
    if(catalog.length) {
      const ready = catalog.find(skin => installed.get(skin.id)?.roles.interaction);
      selectSkin(ready || catalog[0]);
    }
  } catch(error) {
    $("cards").appendChild(el("p","status",String(error)));
    setStatus("请用 python -m http.server 8000 启动网页，而不是直接双击 HTML");
  }
})();
</script>
</body>
