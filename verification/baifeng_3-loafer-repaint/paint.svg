    .rear-apron { fill: url(#rearApron); }
    .front-saddle { fill: url(#frontSaddle); }
    .rear-saddle { fill: url(#rearSaddle); }
    .hardware { stroke: url(#silver); }
    .structure .rubber { fill: #202329; }
    .structure .front-quarter, .structure .rear-quarter { fill: #3b4049; }
    .structure .front-apron, .structure .rear-apron { fill: #555c68; }
    .structure .front-saddle, .structure .rear-saddle { fill: #303540; }
    .structure .hardware { stroke: #a2a8b2; }
