<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重返未来：1999 · Live2D / Spine 本地预览</title>
<link rel="stylesheet" href="../vendor/spine-player4.2.css">
<style>
:root{color-scheme:dark;--bg:#0d121b;--panel:#141e2a;--line:#304151;--muted:#9fb2c3;--accent:#d9b674}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:#f1eee7}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,input{font:inherit}
header{display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;border-bottom:1px solid var(--line)}header strong{font-size:1.18rem}header small{display:block;color:var(--muted);margin-top:.25rem}
main{display:grid;grid-template-columns:290px minmax(320px,1fr) 260px;min-height:calc(100vh - 76px)}
aside{background:var(--panel);min-width:0;padding:1rem;overflow-y:auto}aside.left{border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line)}
input{width:100%;border:1px solid var(--line);border-radius:9px;padding:.7rem;background:#0f1721;color:inherit;outline:none}input:focus{border-color:var(--accent)}
.note{font-size:.78rem;color:var(--muted);line-height:1.6}.count{font-size:.8rem;color:var(--muted);margin:.7rem 0}
#models{display:flex;flex-direction:column;gap:.45rem}button.item{width:100%;text-align:left;cursor:pointer;border-radius:8px;border:1px solid transparent;background:#1b2838;color:inherit;padding:.65rem .75rem}
button.item:hover,button.item.active{border-color:var(--accent);background:#273747}button.item small{color:var(--muted);display:block;margin-top:.15rem;font-size:.75rem}
section.stage{position:relative;min-height:580px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#243447,#101923 72%)}
#stage-area{width:100%;height:100%;min-height:580px;touch-action:none;cursor:grab}#stage-area:active{cursor:grabbing}#canvas{display:block;width:100%;height:100%}
#stage-area[hidden],#spine-stage[hidden]{display:none!important}
#spine-stage{position:absolute;inset:0;width:100%;height:100%;min-height:580px}
#spine-container{position:relative;z-index:1;width:100%;height:100%;min-height:580px}
#scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;pointer-events:none}
#scene-bg[hidden],#scene-notice[hidden]{display:none!important}
#scene-notice{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);z-index:2;
color:#fff5db;background:rgba(12,19,29,.8);border:1px solid #9e8662;
padding:.4rem .8rem;border-radius:6px;font-size:.73rem;text-align:center;pointer-events:none;max-width:90%}
#spine-container canvas{display:block}
@media(max-width:660px){#spine-stage,#spine-container{min-height:450px}}
.overlay{pointer-events:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:90%;white-space:pre-wrap;color:#e8ddc8;background:#101923d8;padding:1rem 1.3rem;border-radius:10px;line-height:1.6}
.stage-toolbar{position:absolute;left:1rem;top:1rem;z-index:2;background:#0e1724c2;border:1px solid #465568;border-radius:9px;padding:.6rem .8rem;max-width:80%;pointer-events:none}
.stage-toolbar .title{font-weight:650}.stage-toolbar .subtitle{font-size:.78rem;color:var(--muted);margin-top:.2rem}
.controls h3{font-size:.95rem;margin:0 0 .7rem}.controls .list{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem}
.controls button{border:1px solid #45596c;border-radius:6px;padding:.38rem .58rem;background:#223041;color:inherit;font-size:.77rem;cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.controls button:hover{border-color:var(--accent)}.empty{color:var(--muted);font-size:.82rem;line-height:1.6}
@media(max-width:1080px){main{grid-template-columns:240px 1fr}.right{grid-column:1 / -1;border-top:1px solid var(--line);border-left:0!important}.right .controls{display:grid;grid-template-columns:1fr 1fr;gap:1rem}}
@media(max-width:660px){main{display:flex;flex-direction:column}.left{max-height:230px;border-right:0!important;border-bottom:1px solid var(--line)}.stage{min-height:450px!important}#stage-area{height:450px;min-height:450px}.right .controls{display:block}header{padding:.8rem}}
</style>
</head>
<body>
<header><a href="../../index.html">← 返回游戏列表</a><div><strong>重返未来：1999</strong><small>Live2D / Spine · 本地资源预览器</small></div></header>
<main>
  <aside class="left">
    <input id="search" type="search" placeholder="搜索角色名、皮肤、ID" aria-label="搜索模型">
    <div class="count" id="count">读取资源清单中…</div>
    <div id="models"></div>
    <p class="note">只显示本地已有资源。商城场景采用同 ID 的原始背景与商城骨骼组合预览，并非游戏全特效复刻。可运行 <code>python reverse1999/scripts/sync.py list --search 槲寄生</code> 查看可用模型，再下载对应 ID。</p>
  </aside>
  <section class="stage">
    <div class="stage-toolbar" id="model-info" hidden><div id="model-title" class="title"></div><div id="model-skin" class="subtitle"></div></div>
    <div id="stage-area"><canvas id="canvas"></canvas></div>
    <div id="spine-stage" hidden><img id="scene-bg" alt="该皮肤的原始商城背景" hidden><div id="spine-container"></div><div id="scene-notice" hidden>商城背景 + 角色骨骼素材组合预览 · 非游戏内完整复刻</div></div>
    <div class="overlay" id="status">请从左侧选择模型</div>
  </section>
  <aside class="right"><div class="controls"><div><h3>展示姿态</h3><div class="list" id="poses"><p class="empty">选择 Spine 模型后显示</p></div></div><div><h3>动作</h3><div class="list" id="motions"><p class="empty">选择模型后显示</p></div></div><div><h3>表情</h3><div class="list" id="expressions"><p class="empty">选择模型后显示</p></div></div></div><p class="note">拖动模型平移，滚轮缩放，鼠标移动可控制视线（视模型支持情况）。</p></aside>
</main>
<script src="../../shared/vendor/live2dcubismcore.min.js"></script>
<script src="../../shared/vendor/pixi.min.js"></script>
<script src="../../shared/vendor/live2d.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let app, active = null, selected = null, requestId = 0, models = [];
let spinePlayer = null, spineScriptPromise = null, poseToken = 0;
const FORCE = (PIXI.live2d.MotionPriority && PIXI.live2d.MotionPriority.FORCE) || 3;

function message(value){$('status').hidden = false; $('status').textContent = value;}
function hideMessage(){ $('status').hidden = true; }
function renderList(){
  const q = $('search').value.trim().toLocaleLowerCase();
  const visible = models.filter(m => [m.id,m.name,m.en,m.skin,m.skin_en,m.folder,m.type].some(v => String(v||'').toLocaleLowerCase().includes(q)));
  $('count').textContent = `本地 ${visible.length} / ${models.length} 套模型`;
  $('models').replaceChildren();
  visible.forEach(m => {
    const btn=document.createElement('button');btn.className='item'+(selected===m?' active':'');
    const line=document.createElement('div');line.textContent=`${m.name} · ${m.skin}`;
    const second=document.createElement('small');second.textContent=`${m.type==='scene'?'商城场景（组合预览）':m.type==='spine'?'Spine':'Live2D'} · ${m.id} · ${m.folder}`;
    btn.append(line,second);btn.onclick=()=>selectModel(m);
    $('models').appendChild(btn);
  });
}
function buttons(container, names, onClick){
  container.replaceChildren();
  if(!names.length){container.textContent='暂无可用数据';container.classList.add('empty');return;}
  container.classList.remove('empty');
  names.forEach(name=>{
    const b=document.createElement('button');b.textContent=name;b.onclick=()=>onClick(name);container.appendChild(b);
  });
}
function setupControls(model){
  const settings=model.internalModel && model.internalModel.settings;
  const motionDefs = settings?.motions || {};
  const names = Object.keys(motionDefs).sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true}));
  buttons($('motions'), names, name=>{
    try{model.motion(name,0,FORCE)}catch(err){message('动作播放失败：'+err.message)}
  });
  // Cubism model3.json 常使用 Expressions 数组，直接调用 expression(name) 切换。
  const expressions = settings?.expressions || [];
  const expressionNames = Array.isArray(expressions)?expressions.map(x=>x.Name||x.name).filter(Boolean):Object.keys(expressions);
  buttons($('expressions'), [...new Set(expressionNames)], name=>{
    try{model.expression(name)}catch(err){message('表情切换失败：'+err.message)}
  });
}
function fit(model){
  const w=$('stage-area').clientWidth,h=$('stage-area').clientHeight;
  if(w<=0||h<=0)return;
  app.renderer.resize(w,h);
  model.scale.set(1);
  const width=model.width||1,height=model.height||1;
  model.scale.set(Math.min(w*.82/width,h*.85/height,4));
  model.position.set(w/2,h/2);
}
function disposeSpine(){
  if(spinePlayer){
    try{spinePlayer.dispose();}catch(error){console.warn('Spine dispose:',error);}
    spinePlayer=null;
  }
  $('spine-container').replaceChildren();
}

// NIKKE 的 4.0/4.1 播放器不兼容 1999 的 4.2；使用独立的本地运行时。
function loadSpineRuntime(){
  if(window.spine && window.spine.SpinePlayer) return Promise.resolve(window.spine);
  if(spineScriptPromise) return spineScriptPromise;
  spineScriptPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='../vendor/spine-player4.2.min.js';
    script.onload=()=>{
      if(window.spine && window.spine.SpinePlayer) resolve(window.spine);
      else reject(new Error('Spine 4.2 运行时加载后未暴露 SpinePlayer'));
    };
    script.onerror=()=>reject(new Error('缺少本地 Spine 4.2 运行时，请执行 python reverse1999/scripts/sync.py setup-runtime'));
    document.head.appendChild(script);
  }).catch(error=>{spineScriptPromise=null;throw error;});
  return spineScriptPromise;
}

function playSpineAnimation(player, name){
  const loop=/idle|stand|wait|loop/i.test(name);
  player.setAnimation(name,loop);
  player.play();
}

async function loadSpinePose(m, poseName, modelToken){
  const tk=++poseToken;
  disposeSpine();
  const p=m.poses?.[poseName];
  if(!p)return message('该姿态无骨骼文件');
  buttons($('motions'),[],()=>{});
  buttons($('expressions'),[],()=>{});
  if(!String(p.version||'').startsWith('4.2.')){
    message(`此资源是 Spine ${p.version}，目前仅配置了 4.2 运行时，不能强行解析。`);
    return;
  }
  message(`正在加载 ${poseName} 动画…`);
  try{
    const runtime=await loadSpineRuntime();
    if(modelToken!==requestId||tk!==poseToken)return;
    const base=m.dir+'/';
    spinePlayer=new runtime.SpinePlayer('spine-container',{
      skeleton:base+p.skel,
      atlas:base+p.atlas,
      showControls:false,
      alpha:true,
      backgroundColor:'#00000000',
      premultipliedAlpha:true,
      preserveDrawingBuffer:true,
      defaultMix:0.2,
      success:(pl)=>{
        if(modelToken!==requestId||tk!==poseToken)return;
        hideMessage();
        try{
          const names=pl.animationState.data.skeletonData.animations.map(a=>a.name);
          buttons($('motions'),names,name=>{
            try{playSpineAnimation(pl,name);}catch(error){message('动作播放失败：'+error.message);}
          });
          const idle=names.find(name=>/idle|stand|wait|loop/i.test(name))||names[0];
          if(idle)playSpineAnimation(pl,idle);
        }catch(error){console.error(error);message('已加载模型，但无法读取动作列表：'+error.message);}
      },
      error:(pl,msg)=>{if(modelToken===requestId&&tk===poseToken)message('Spine 加载失败：'+String(msg||'资源不兼容'));}
    });
  }catch(error){
    if(modelToken!==requestId||tk!==poseToken)return;
    console.error(error);message('无法播放 Spine 模型：'+error.message);
  }
}

async function selectModel(m){
  selected=m;renderList();const token=++requestId;
  ++poseToken;
  if(active){app.stage.removeChild(active);active.destroy();active=null;}
  disposeSpine();
  $('scene-bg').hidden=true;
  $('scene-notice').hidden=true;
  $('scene-bg').removeAttribute('src');
  $('model-info').hidden=false;$('model-title').textContent=m.name;
  $('model-skin').textContent=`${m.skin} · ${m.en || m.folder}`;
  buttons($('motions'),[],()=>{});buttons($('expressions'),[],()=>{});
  if(m.type==='scene'){
    $('stage-area').hidden=true;
    $('spine-stage').hidden=false;
    const cfg=m.scene;
    $('scene-bg').src=cfg.background;
    $('scene-bg').hidden=false;
    $('scene-notice').hidden=false;
    const sceneModel={...m,dir:cfg.dir,poses:{商城展示:{skel:cfg.skel,atlas:cfg.atlas,version:cfg.version}}};
    buttons($('poses'),['商城展示'],()=>loadSpinePose(sceneModel,'商城展示',token));
    loadSpinePose(sceneModel,'商城展示',token);
    return;
  }
  if(m.type==='spine'){
    $('stage-area').hidden=true;
    $('spine-stage').hidden=false;
    const poses=Object.keys(m.poses||{});
    const preferred=poses.includes('ui')?'ui':(poses.includes('room')?'room':poses[0]);
    buttons($('poses'),poses,name=>loadSpinePose(m,name,token));
    if(!preferred)message('当前目录没有可播放的 Spine 骨骼文件');
    else loadSpinePose(m,preferred,token);
    return;
  }
  $('spine-stage').hidden=true;
  $('stage-area').hidden=false;
  buttons($('poses'),[],()=>{});
  message('正在加载 Live2D 模型和贴图…');
  try{
    const model=await PIXI.live2d.Live2DModel.from(m.path,{autoInteract:false});
    if(token!==requestId){model.destroy();return;}
    active=model;
    model.anchor.set(.5,.5);
    app.stage.addChild(model);
    fit(model);
    setupControls(model);
    hideMessage();
  }catch(error){if(token!==requestId)return;console.error(error);message(`无法加载 Live2D 模型：${error.message}\n请确认下载完整，并查看浏览器控制台。`);}
}
function initInteraction(){
  const area=$('stage-area');let drag=false,px=0,py=0;
  area.addEventListener('pointerdown',e=>{if(!active)return;drag=true;px=e.clientX;py=e.clientY;area.setPointerCapture(e.pointerId);});
  area.addEventListener('pointerup',()=>drag=false);
  area.addEventListener('pointercancel',()=>drag=false);
  area.addEventListener('pointermove',e=>{
    if(!active)return;
    if(drag){active.x+=e.clientX-px;active.y+=e.clientY-py;px=e.clientX;py=e.clientY;}
    const rect=area.getBoundingClientRect();
    try{active.focus(e.clientX-rect.left,e.clientY-rect.top)}catch(error){/* 不是每个模型都带视线参数 */}
  });
  area.addEventListener('wheel',e=>{if(!active)return;e.preventDefault();const factor=e.deltaY<0?1.07:.93;active.scale.set(Math.max(.01,Math.min(50,active.scale.x*factor)));},{passive:false});
  window.addEventListener('resize',()=>{if(active)fit(active);});
}
async function start(){
  try{
    const response=await fetch('manifest.json',{cache:'no-store'});
    if(!response.ok)throw new Error(`资源清单 HTTP ${response.status}`);
    const payload=await response.json();models=payload.models||[];
    app = new PIXI.Application({view:$('canvas'),resizeTo:$('stage-area'),backgroundAlpha:0,antialias:true,autoDensity:true,resolution:Math.min(devicePixelRatio||1,2)});
    initInteraction();renderList();$('search').addEventListener('input',renderList);
    if(!models.length)message('目前还没有下载任何模型。\n先运行：python reverse1999/scripts/sync.py download 315901');
  }catch(error){console.error(error);message('查看器初始化失败：'+error.message);}
}
start();
</script>
</body>
</html>
